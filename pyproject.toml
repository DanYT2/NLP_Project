[project]
name = "nlp-project"
version = "0.1.0"
description = "HSLU NALAPRO project — Q1: two-layer MLP on 20 Newsgroups."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
    "gensim>=4.4.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "nltk>=3.9.4",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.2",
    "transformers>=5.8.1",
    "wandb>=0.26.1",
    "weave>=0.52.39",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests that fetch data over the network or train for >1s",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nlp_project"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
